<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Dev Psalmist logo: a DP monogram in ice blue on a Prussian blue tile</title>
  <desc id="d">Rounded square tile in a Prussian blue gradient with a thin ice-blue frame and the letters D and P drawn as a geometric monogram.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04052E"/>
      <stop offset="0.55" stop-color="#070A38"/>
      <stop offset="1" stop-color="#101353"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#B4BDFF"/>
      <stop offset="1" stop-color="#6F7EEE"/>
    </linearGradient>
    <linearGradient id="mark2" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE2FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="#7C8BF2" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#7C8BF2" stroke-opacity="0.14" stroke-width="1.5"/>

  <g transform="translate(43 0)">
    <path fill="url(#mark)" fill-rule="evenodd"
          d="M100 160 H126 V352 H100 Z
             M126 160 A96 96 0 0 1 126 352 Z
             M126 186 A70 70 0 0 1 126 326 Z"/>
    <path fill="url(#mark2)" fill-rule="evenodd"
          d="M244 160 H270 V352 H244 Z
             M270 160 A56 56 0 0 1 270 272 Z
             M270 186 A30 30 0 0 1 270 246 Z"/>
  </g>

  <rect x="196" y="392" width="120" height="6" rx="3" fill="#7C8BF2" fill-opacity="0.55"/>
</svg>
